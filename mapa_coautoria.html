<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Mapa de Coautoria</title><script src="https://d3js.org/d3.v7.min.js"></script><style>body{margin:0;font-family:Arial;background:#f4f4f4}header{background:#111;color:#fff;padding:20px;display:flex;justify-content:space-between}header span{color:#e85d04;font-style:italic}.container{padding:20px}.card{background:#fff;padding:20px;border-radius:10px}#graph{height:700px;border:1px solid #ddd}.side{position:absolute;top:110px;right:20px;width:230px;background:#fff;padding:15px;border-radius:8px}</style></head><body><header><div><h1>Mapa de <span>Coautoria</span></h1><small>Autores conectados por artigos em comum</small></div><div id="stats">Carregando...</div></header><div class="container"><div class="card"><svg id="graph" width="1200" height="700"></svg></div></div><div class="side"><h3>Detalhes do Autor</h3><div id="details">Clique em um autor.</div></div><script>const SUPABASE_URL="https://slczoexfrujtqimumrhv.supabase.co";const SUPABASE_KEY="SUBSTITUA_PELA_CHAVE";async function carregar(){const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};const [aR,rR]=await Promise.all([fetch(`${SUPABASE_URL}/rest/v1/author?select=*`,{headers}),fetch(`${SUPABASE_URL}/rest/v1/author_artigos?select=*`,{headers})]);const authors=await aR.json();const rel=await rR.json();const artigos={};rel.forEach(r=>{const aid=r.id_artigo||r.artigo_id||r.idartigo;const au=r.idauthor||r.author_id;if(!artigos[aid])artigos[aid]=[];artigos[aid].push(au)});const edges={};Object.values(artigos).forEach(l=>{for(let i=0;i<l.length;i++){for(let j=i+1;j<l.length;j++){const k=[l[i],l[j]].sort().join("-");edges[k]=(edges[k]||0)+1}}});const nodes=authors.map(a=>({id:a.idauthor||a.id,name:a.nome||a.author||a.name||`Autor ${a.id}`,papers:rel.filter(r=>(r.idauthor||r.author_id)==(a.idauthor||a.id)).length}));const links=Object.entries(edges).map(([k,w])=>{const[s,t]=k.split("-");return{source:s,target:t,weight:w}});desenhar(nodes,links);document.getElementById("stats").innerHTML=`${nodes.length} autores<br>${links.length} conexões`}function desenhar(nodes,links){const svg=d3.select("#graph"),w=+svg.attr("width"),h=+svg.attr("height"),color=d3.scaleOrdinal(d3.schemeCategory10);const sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(90)).force("charge",d3.forceManyBody().strength(-220)).force("center",d3.forceCenter(w/2,h/2));const link=svg.append("g").selectAll("line").data(links).enter().append("line").attr("stroke","#999").attr("stroke-width",d=>Math.sqrt(d.weight));const node=svg.append("g").selectAll("circle").data(nodes).enter().append("circle").attr("r",d=>5+Math.sqrt(d.papers)*2).attr("fill",(d,i)=>color(i%10)).call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));node.append("title").text(d=>`${d.name} (${d.papers} artigos)`);node.on("click",(e,d)=>{document.getElementById("details").innerHTML=`<b>${d.name}</b><br>Artigos: ${d.papers}`});const label=svg.append("g").selectAll("text").data(nodes).enter().append("text").text(d=>d.name).style("font-size","10px");sim.on("tick",()=>{link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);node.attr("cx",d=>d.x).attr("cy",d=>d.y);label.attr("x",d=>d.x+8).attr("y",d=>d.y+4)})}carregar().catch(e=>console.error(e));</script></body></html>
