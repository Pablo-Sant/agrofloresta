<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Top 20 Autores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
    }

    header {
      background: #1a1a2e;
      padding: 16px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 18px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header h1 span { color: #e85d04; font-style: italic; }
    header .meta {
      font-size: 11px;
      color: #9ca3af;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 16px 30px;
      padding: 7px 14px;
      background: #1a1a2e;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.8; }

    .section-label {
      margin: 0 30px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
    }
    .section-label::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 3px;
      background: #e85d04;
      border-radius: 2px;
    }

    .container { padding: 0 30px 30px; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    /* Tabela de autores */
    .author-table { width: 100%; border-collapse: collapse; }
    .author-table thead tr {
      border-bottom: 2px solid #1a1a2e;
    }
    .author-table th {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #6b7280;
      padding: 8px 10px;
      text-align: left;
    }
    .author-table th.right { text-align: right; }
    .author-table td {
      padding: 10px 10px;
      font-size: 13px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }
    .author-table tr:hover td { background: #f9fafb; }

    .rank {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 600;
      width: 30px;
    }
    .author-name {
      color: #1d4ed8;
      font-weight: 500;
      min-width: 180px;
    }
    .bar-cell { width: 100%; }
    .bar-wrap {
      background: #f3f4f6;
      border-radius: 4px;
      height: 10px;
      width: 100%;
      overflow: hidden;
    }
    .bar-fill {
      height: 10px;
      border-radius: 4px;
      background: #e85d04;
      transition: width 0.6s ease;
    }
    .bar-fill.alt { background: #1d4ed8; }
    .count {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: right;
      min-width: 30px;
    }

    #loading {
      text-align: center;
      padding: 60px;
      color: #6b7280;
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #e85d04;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      background: #1a1a2e;
      color: #9ca3af;
      font-size: 11px;
      padding: 6px 30px;
      letter-spacing: 1px;
    }
    .status-bar span { color: #e85d04; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <h1>Dashboard <span>Bibliométrico</span> — Agroforestry</h1>
  <div class="meta" id="header-meta">Carregando...</div>
</header>

<a href="index.html" class="back-btn">← Voltar ao Gerenciador</a>

<div class="section-label">Autores</div>

<div class="container">
  <div class="card">
    <div class="card-title">Top 20 Autores <span style="background:#e85d04;color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;margin-left:6px;">por produtividade</span></div>
    <div class="card-sub">Número de artigos na base · separados por ponto e vírgula no campo Authors</div>

    <div id="loading">
      <div class="spinner"></div><br>Buscando dados do Supabase...
    </div>

    <table class="author-table" id="author-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Autor</th>
          <th>Frequência</th>
          <th class="right">N</th>
        </tr>
      </thead>
      <tbody id="author-tbody"></tbody>
    </table>
  </div>
</div>

<div class="status-bar" id="status-bar">Aguardando dados...</div>

<script>
  const SUPABASE_URL = "https://slczoexfrujtqimumrhv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_U_mpgcL_DwBGqXIvHcKGsg_e6FDWuHq";

  async function buscarTodos() {
    let todos = [];
    let from = 0;
    const PAGE = 1000;
    while (true) {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/artigos?select=id,"Authors"&limit=${PAGE}&offset=${from}`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const page = await r.json();
      if (!page.length) break;
      todos = todos.concat(page);
      from += PAGE;
      if (page.length < PAGE) break;
    }
    return todos;
  }

  async function init() {
    try {
      const artigos = await buscarTodos();
      const total = artigos.length;

      // Contar autores
      const contagem = {};
      for (const art of artigos) {
        if (!art["Authors"]) continue;
        const autores = art["Authors"].split(";").map(a => a.trim()).filter(Boolean);
        for (const autor of autores) {
          contagem[autor] = (contagem[autor] || 0) + 1;
        }
      }

      const ranking = Object.entries(contagem)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 20);

      const maxVal = ranking[0]?.[1] || 1;
      const totalAutores = Object.keys(contagem).length;

      document.getElementById("header-meta").textContent =
        `SCOPUS · ${total} ARTIGOS · ${totalAutores} AUTORES ÚNICOS`;

      document.getElementById("status-bar").innerHTML =
        `Base: <span>${total}</span> artigos · <span>${totalAutores}</span> autores únicos identificados · Top <span>20</span> exibidos`;

      const tbody = document.getElementById("author-tbody");
      const colors = ["#e85d04","#e85d04","#e85d04","#1d4ed8","#1d4ed8","#1d4ed8","#16a34a","#16a34a","#16a34a","#7c3aed","#7c3aed","#7c3aed","#0891b2","#0891b2","#0891b2","#9ca3af","#9ca3af","#9ca3af","#9ca3af","#9ca3af"];

      ranking.forEach(([autor, n], i) => {
        const pct = (n / maxVal * 100).toFixed(1);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="rank">${i + 1}</td>
          <td class="author-name">${autor}</td>
          <td class="bar-cell">
            <div class="bar-wrap">
              <div class="bar-fill" style="width:${pct}%;background:${colors[i]}"></div>
            </div>
          </td>
          <td class="count">${n}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("loading").style.display = "none";
      document.getElementById("author-table").style.display = "table";

    } catch (e) {
      document.getElementById("loading").innerHTML = `❌ Erro ao carregar dados: ${e.message}`;
    }
  }

  init();
</script>
</body>
</html>
